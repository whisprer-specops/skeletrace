[package]
name = "skeletrace"
version = "1.0.1"
edition = "2021"
rust-version = "1.87"
description = "Sparse spatiotemporal flow-graph engine for OSINT telemetry"
authors = ["whispr.dev"]
# GPL-3.0-only, as in LICENSE and the SPDX line atop every code file. (An old manifest wrongly claimed MIT.)
license = "GPL-3.0-only"
default-run = "skeletrace"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.44", features = ["serde"] }
uuid = { version = "=1.22.0", features = ["serde", "v4", "v5"] }
ureq = { version = "=2.12.1", features = ["socks-proxy"] }
base64 = "=0.22.1"
rss = "=2.0.12"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
skeletrace-algo = { path = "skeletrace-algo" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
